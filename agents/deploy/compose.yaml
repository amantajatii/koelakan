# Run from the repository root layout (see deploy.sh):
#   docker compose -f agents/deploy/compose.yaml --project-directory agents/deploy up -d --build
name: koelakan
services:
  agent:
    build:
      context: ../..
      dockerfile: agents/deploy/Dockerfile
    image: koelakan-agent:latest
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    volumes:
      - agent-data:/data
      - ./secrets/keys:/secrets/keys:ro
      - ./secrets/fck:/secrets/fck:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [agent]
    ports: ["80:80", "443:443"]
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:-agent.43-157-202-28.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  agent-data:
  caddy-data:
  caddy-config:
