[package]
name = "market"
version = "0.1.0"
edition = "2021"
description = "Koelakan market: pooled orders, sealed-bid auctions and escrow for warung agents"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
